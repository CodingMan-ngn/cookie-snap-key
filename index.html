<!DOCTYPE html>
<html lang="in">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Snap - Claim Key</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; color: #fff; text-align: center; padding: 50px 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .logo { font-size: 48px; margin-bottom: 20px; }
        h1 { font-size: 32px; color: #FFD700; }
        p { font-size: 16px; color: #aaa; }
        button { padding: 18px 40px; background: linear-gradient(135deg, #FFD700, #D4AF37); color: #000; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 30px; }
        button:hover { transform: scale(1.05); }
        #keyBox { margin-top: 30px; font-size: 24px; font-weight: bold; color: #FFD700; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 15px; display: none; word-break: break-all; }
        #errorBox { display: none; color: red; font-size: 24px; font-weight: bold; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="logo">🍪</div>
    <h1>Cookie Snap Key Claim</h1>
    <p id="status">Loading secure token...</p>
    <button id="claimBtn" onclick="claimKey()" style="display:none;">Claim Your Key</button>
    <div id="keyBox"></div>
    <div id="errorbox">❌ This claim link has expired.<br>Please go back and complete the task again.</div>

    <script>
        // 1. Generate the one-time token on page load
        let claimToken = localStorage.getItem('myClaimToken');
        if (!claimToken) {
            // First load: generate token
            fetch('https://cookie-snap-keys.j26064135.workers.dev/generate-token')
                .then(r => r.json())
                .then(data => {
                    claimToken = data.token;
                    localStorage.setItem('myClaimToken', claimToken);
                    document.getElementById('status').innerText = "Ready to claim!";
                    document.getElementById('claimBtn').style.display = 'block';
                })
                .catch(() => {
                    document.getElementById('status').innerText = "Error connecting to server.";
                });
        } else {
            // They refreshed: The token was already deleted from server or not yet used.
            // We need to check if the token is still valid by trying to claim. Since this is only an HTML file,
            // We'll just attempt to use the token. If it's used, the server returns an error.
            document.getElementById('status').innerText = "Ready to claim!";
            document.getElementById('claimBtn').style.display = 'block';
        }

        // 2. Claim Key function
        async function claimKey() {
            const btn = document.getElementById('claimBtn');
            btn.disabled = true;
            btn.textContent = "Claiming...";
            const urlParams = new URLSearchParams(window.location.search);
            const dataCode = urlParams.get('data');

            try {
                const response = await fetch(`https://cookie-snap-keys.j26064135.workers.dev/claim?token=${claimToken}&data=${dataCode}`);
                const data = await response.json();

                if (data.success) {
                    // Success! Attempt to close the page.
                    document.getElementById('status').innerText = "Key claimed!";
                    document.getElementById('keyBox').style.display = 'block';
                    document.getElementById('keyBox').innerHTML = `<strong>Your Key:</strong><br>${data.key}<br><small>Copied to clipboard!</small>`;
                    
                    // Attempt to copy
                    navigator.clipboard.writeText(data.key).catch(() => {});

                    // Attempt to close
                    setTimeout(() => {
                        window.close();
                        // If window.close() is blocked, redirect to a dead-end
                        setTimeout(() => { window.location.href = "about:blank"; }, 500);
                    }, 3000); // Give 3 seconds to see the key
                } else {
                    // Token already used or invalid!
                    document.getElementById('status').style.display = 'none';
                    document.getElementById('claimBtn').style.display = 'none';
                    document.getElementById('errorBox').style.display = 'block';
                }
            } catch (e) {
                alert("Network error");
                btn.disabled = false;
                btn.textContent = "Try Again";
            }
        }
    </script>
</body>
</html>
