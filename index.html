<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Snap - Claim Key</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 100%);
            color: #fff;
            text-align: center;
            padding: 50px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #a78bfa;
        }
        p {
            font-size: 16px;
            margin-bottom: 30px;
            color: #94a3b8;
        }
        button {
            padding: 18px 40px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }
        button:hover {
            background: #7c3aed;
            transform: scale(1.05);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }
        #keyBox {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #22c55e;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 10px;
            display: none;
            word-break: break-all;
            max-width: 400px;
        }
        #note {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="logo">🍪</div>
    <h1>Cookie Snap Key Claim</h1>
    <p>Click the button below to claim your 5-day key</p>
    
    <button id="claimBtn" onclick="claimKey()">Claim Your Key</button>
    
    <div id="keyBox"></div>
    <p id="note">This key is valid for 5 days. You must complete the task to continue.</p>

    <script>
        async function claimKey() {
            const btn = document.getElementById('claimBtn');
            const keyBox = document.getElementById('keyBox');

            btn.disabled = true;
            btn.textContent = "Claiming...";

            try {
                // 🔑 Call your Cloudflare Worker to generate the key
                const response = await fetch('https://cookie-snap-keys.j26064135.workers.dev/claim');
                const data = await response.json();

                if (data.success) {
                    // Show the key
                    keyBox.style.display = 'block';
                    keyBox.innerHTML = `Your Key: <br><br> <span style="font-size:28px;">${data.key}</span>`;
                    btn.textContent = "Key Claimed!";
                } else {
                    alert("Error: " + (data.error || "Could not claim key"));
                    btn.disabled = false;
                    btn.textContent = "Try Again";
                }
            } catch (error) {
                alert("Network error: Could not connect to server");
                btn.disabled = false;
                btn.textContent = "Try Again";
            }
        }
    </script>
</body>
</html>
