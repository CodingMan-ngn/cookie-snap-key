<script>
    // Generate a unique Device ID if it doesn't exist
    if (!localStorage.getItem('deviceId')) {
        localStorage.setItem('deviceId', 'DEV-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10));
    }
    const deviceId = localStorage.getItem('deviceId');

    // Prevent refresh bypass: If already claimed, show a message and block
    if (localStorage.getItem('claimed')) {
        document.getElementById('keyBox').innerHTML = "⚠️ Key already generated for this device.<br>Please close this tab.";
        document.getElementById('keyBox').style.display = 'block';
        document.getElementById('claimBtn').style.display = 'none';
    } else {
        // Auto-close timer (60 seconds)
        setTimeout(function() {
            document.getElementById('keyBox').innerHTML = "⏳ Tab closing in 10 seconds...";
            document.getElementById('keyBox').style.display = 'block';
            setTimeout(function() {
                window.close(); // Attempt to close the tab (may be blocked by browser, fallback message shown)
                // Fallback: redirect to about:blank if browser blocks close
                setTimeout(() => { window.location.href = 'about:blank'; }, 500);
            }, 10000);
        }, 60000); // 1 minute timer
    }

    async function claimKey() {
        const btn = document.getElementById('claimBtn');
        const keyBox = document.getElementById('keyBox');

        btn.disabled = true;
        btn.textContent = "Claiming...";

        try {
            const response = await fetch(`https://cookie-snap-keys.j26064135.workers.dev/claim?deviceId=${deviceId}`);
            const data = await response.json();

            if (data.success) {
                // Mark as claimed so they cannot refresh and get a new one
                localStorage.setItem('claimed', 'true');
                
                // Show the key
                keyBox.style.display = 'block';
                keyBox.innerHTML = `Your Key: <br><br> <span style="font-size:28px;">${data.key}</span><br><br><small>⚠️ Expires in 20 mins if not activated!</small>`;
                btn.textContent = "Key Claimed!";
                // Start the auto-close timer
                setTimeout(function() {
                    window.close();
                    setTimeout(() => { window.location.href = 'about:blank'; }, 500);
                }, 60000);
            } else {
                alert("Error: " + (data.error || "Could not claim key"));
                // Refresh bypass detected, block them
                if (data.error.includes("already generated")) {
                    localStorage.setItem('claimed', 'true');
                    document.getElementById('claimBtn').style.display = 'none';
                    document.getElementById('keyBox').innerHTML = "⚠️ Key already generated for this device.<br>Please close this tab.";
                    document.getElementById('keyBox').style.display = 'block';
                } else {
                    btn.disabled = false;
                    btn.textContent = "Try Again";
                }
            }
        } catch (error) {
            alert("Network error: Could not connect to server");
            btn.disabled = false;
            btn.textContent = "Try Again";
        }
    }
</script>
