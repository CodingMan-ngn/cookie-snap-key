<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX - Claim Key</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #fff;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* VORTEX image as background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('vortex-bg.png') center center / cover no-repeat;
            z-index: -2;
            filter: brightness(0.6) blur(2px);
            transform: scale(1.05);
        }

        /* Dark overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 26, 0.7);
            z-index: -1;
        }

        .vortex-container {
            max-width: 440px;
            width: 92%;
            background: rgba(26, 35, 58, 0.95);
            border: 1px solid #3b82f6;
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.4);
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .vortex-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            letter-spacing: 3px;
        }

        .vortex-subtitle {
            font-size: 13px;
            color: #a3b1c6;
            margin-bottom: 10px;
        }

        .key-icon {
            font-size: 36px;
            margin-bottom: 10px;
            color: #ffd700;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Timer Row */
        .timer-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
        }

        .timer-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 10px 14px;
            min-width: 120px;
            flex: 1;
        }

        .timer-label {
            font-size: 10px;
            color: #a3b1c6;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .timer-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            color: #60a5fa;
        }

        .timer-value.warning {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        .timer-value.expired {
            color: #ff6b6b;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn-claim {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: #000;
            border: none;
            border-radius: 50px;
            padding: 14px 32px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
            margin-top: 8px;
            width: 100%;
        }

        .btn-claim:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 30px rgba(59, 130, 246, 0.6);
        }

        .btn-claim:disabled {
            background: #64748b;
            color: #fff;
            cursor: not-allowed;
            transform: none;
        }

        .btn-get-key {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-get-key:hover {
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.6);
        }

        #status {
            color: #a3b1c6;
            margin-bottom: 12px;
            font-size: 14px;
        }

        #keyBox {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 700;
            color: #60a5fa;
            background: rgba(0, 0, 0, 0.6);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #3b82f6;
            display: none;
            word-break: break-all;
            max-width: 380px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
        }

        #errorBox {
            display: none;
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 12px;
            max-width: 600px;
            line-height: 1.6;
        }

        .footer-note {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #64748b;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .success-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
        }

        .success-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: #4ade80;
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(74, 222, 128, 0.5); }
            to { text-shadow: 0 0 30px rgba(74, 222, 128, 1); }
        }

        body {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div class="vortex-container" id="mainContainer">
        <div class="vortex-logo">VORTEX</div>
        <div class="vortex-subtitle">Secure Key Claim</div>
        <div class="key-icon">🔑</div>

        <!-- Timers -->
        <div class="timer-row">
            <div class="timer-box">
                <div class="timer-label">Key Expires In</div>
                <div class="timer-value" id="keyTimer">10:00</div>
            </div>
            <div class="timer-box">
                <div class="timer-label">Page Closes In</div>
                <div class="timer-value" id="pageTimer">1:00</div>
            </div>
        </div>

        <p id="status">Loading secure token...</p>

        <button id="getKeyBtn" class="btn-claim btn-get-key" style="display:none;">🛒 GET KEY NOW</button>
        <button id="claimBtn" class="btn-claim" style="display:none;">⚡ Claim Your Key</button>

        <div id="keyBox"></div>
        <div id="errorBox">❌ This claim link has expired.<br>Please go back and complete the task again.</div>
    </div>
    <div class="footer-note">VORTEX v5.0 • Secure Key Distribution</div>

    <script>
        // Disable right-click and Ctrl+U/Ctrl+S
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                return false;
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const dataCode = urlParams.get('data');
        const LOOTLABS_URL = 'https://loot-link.com/s?OcqajUzG';
        const WORKER_URL = 'https://cookie-snap-keys.j26064135.workers.dev';

        // Timer variables
        const KEY_TIMER_SECONDS = 600; // 10 minutes
        const PAGE_TIMER_SECONDS = 60; // 1 minute
        let keyTimerRemaining = KEY_TIMER_SECONDS;
        let pageTimerRemaining = PAGE_TIMER_SECONDS;
        let pageTimerStarted = false;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // If no data param → auto redirect to LootLabs after 2 seconds
        if (!dataCode) {
            document.getElementById('status').style.display = 'none';
            document.getElementById('claimBtn').style.display = 'none';
            document.getElementById('getKeyBtn').style.display = 'block';

            // Auto-redirect after 2 seconds
            setTimeout(() => {
                window.location.href = LOOTLABS_URL;
            }, 2000);

            // The "Get Key" button also redirects immediately
            document.getElementById('getKeyBtn').addEventListener('click', function() {
                window.location.href = LOOTLABS_URL;
            });
        } else {
            // Have data param → show claim button after token generation
            document.getElementById('getKeyBtn').style.display = 'none';
            let claimToken = localStorage.getItem('vortexClaimToken');

            if (!claimToken) {
                fetch(`${WORKER_URL}/generate-token`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            claimToken = data.token;
                            localStorage.setItem('vortexClaimToken', claimToken);
                            document.getElementById('status').innerText = "Ready to claim!";
                            document.getElementById('claimBtn').style.display = 'block';
                            startTimers();
                        } else {
                            throw new Error('Token generation failed');
                        }
                    })
                    .catch(() => {
                        document.getElementById('status').innerText = "Error connecting to server.";
                        document.getElementById('errorBox').innerHTML = "❌ Network error. Please try again.";
                        document.getElementById('errorBox').style.display = 'block';
                    });
            } else {
                document.getElementById('status').innerText = "Ready to claim!";
                document.getElementById('claimBtn').style.display = 'block';
                startTimers();
            }
        }

        function startTimers() {
            // Start key timer (10 min claim window)
            const keyTimerInterval = setInterval(() => {
                keyTimerRemaining--;
                const timerEl = document.getElementById('keyTimer');
                timerEl.textContent = formatTime(keyTimerRemaining);
                if (keyTimerRemaining <= 30) {
                    timerEl.classList.add('warning');
                }
                if (keyTimerRemaining <= 0) {
                    clearInterval(keyTimerInterval);
                    timerEl.textContent = '00:00';
                    timerEl.classList.add('expired');
                    // Invalidate the key/token
                    localStorage.removeItem('vortexClaimToken');
                    document.getElementById('status').innerText = "Key claim window expired.";
                    document.getElementById('claimBtn').style.display = 'none';
                    document.getElementById('errorBox').innerHTML = "❌ This claim window has expired.<br>Please go back and complete the task again.";
                    document.getElementById('errorBox').style.display = 'block';
                    // Clear page timer
                    clearInterval(pageTimerInterval);
                }
            }, 1000);

            // Start page timer (1 minute auto-close)
            const pageTimerInterval = setInterval(() => {
                pageTimerRemaining--;
                const timerEl = document.getElementById('pageTimer');
                timerEl.textContent = formatTime(pageTimerRemaining);
                if (pageTimerRemaining <= 10) {
                    timerEl.classList.add('warning');
                }
                if (pageTimerRemaining <= 0) {
                    clearInterval(pageTimerInterval);
                    timerEl.textContent = '00:00';
                    // Close the page
                    window.close();
                    setTimeout(() => {
                        history.replaceState(null, '', 'about:blank');
                        window.location.href = 'about:blank';
                    }, 500);
                }
            }, 1000);
        }

        // Claim button logic
        document.getElementById('claimBtn').addEventListener('click', async function() {
            const btn = this;
            const statusEl = document.getElementById('status');

            if (keyTimerRemaining <= 0) {
                statusEl.innerText = "Key claim window expired.";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Claiming...";

            let claimToken = localStorage.getItem('vortexClaimToken');
            if (!claimToken) {
                document.getElementById('errorBox').style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${WORKER_URL}/claim?token=${claimToken}&data=${dataCode}`);
                const data = await response.json();

                if (data.success) {
                    localStorage.removeItem('vortexClaimToken');

                    // Show success animation
                    const successOverlay = document.createElement('div');
                    successOverlay.className = 'success-overlay';
                    successOverlay.innerHTML = '<div class="success-text">✅ KEY CLAIMED</div>';
                    document.body.appendChild(successOverlay);

                    statusEl.innerText = "Key claimed!";
                    btn.style.display = 'none';
                    document.getElementById('keyBox').style.display = 'block';
                    document.getElementById('keyBox').innerHTML = `<strong>Your Key:</strong><br><br><span style="font-size:22px;">${data.key}</span><br><br><small>✅ Key copied to clipboard!</small>`;

                    try {
                        await navigator.clipboard.writeText(data.key);
                    } catch (e) {
                        const textArea = document.createElement('textarea');
                        textArea.value = data.key;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }

                    // Stop timers
                    clearInterval(keyTimerInterval);
                    clearInterval(pageTimerInterval);

                    // After 5 seconds, remove key and redirect to about:blank
                    setTimeout(() => {
                        document.getElementById('keyBox').innerHTML = '';
                        document.getElementById('keyBox').style.display = 'none';
                        statusEl.innerText = "Key claimed. Please close this tab.";
                        history.replaceState(null, '', 'about:blank');
                        window.location.href = 'about:blank';
                    }, 5000);

                    // Also try to close after 8 seconds
                    setTimeout(() => {
                        window.close();
                    }, 8000);
                } else {
                    localStorage.removeItem('vortexClaimToken');
                    statusEl.style.display = 'none';
                    btn.style.display = 'none';
                    document.getElementById('errorBox').innerHTML = "❌ This claim link has expired.<br>Please go back and complete the task again.";
                    document.getElementById('errorBox').style.display = 'block';
                }
            } catch (e) {
                alert("Network error. Please try again.");
                btn.disabled = false;
                btn.textContent = "Try Again";
            }
        });

        // Store interval handles globally for cleanup
        let keyTimerInterval, pageTimerInterval;
    </script>
</body>
</html>
