<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEX - Claim Key</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%2360a5fa' stroke-width='8'/><circle cx='50' cy='50' r='25' fill='%233b82f6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Poppins', sans-serif;
    background: #0a0e1a; color: #fff;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    overflow: hidden; position: relative;
}
body::before {
    content: ""; position: fixed; inset: 0;
    background: url('vortex-bg.png') center center / cover no-repeat;
    filter: brightness(0.5) blur(3px); z-index: -2;
}
body::after {
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(10,14,26,0.6), rgba(10,14,26,0.9));
    z-index: -1;
}
.vortex-card {
    max-width: 420px; width: 90%;
    background: rgba(15, 22, 38, 0.85);
    border: 1px solid rgba(96, 165, 250, 0.3);
    border-radius: 24px; padding: 30px 24px;
    box-shadow: 0 0 40px rgba(59, 130, 246, 0.3), inset 0 0 20px rgba(59, 130, 246, 0.1);
    text-align: center; position: relative;
    backdrop-filter: blur(12px);
    animation: cardGlow 4s ease-in-out infinite;
}
.vortex-card.admin-mode {
    border-color: rgba(34, 197, 94, 0.5);
    box-shadow: 0 0 40px rgba(34, 197, 94, 0.3), inset 0 0 20px rgba(34, 197, 94, 0.1);
}
.vortex-logo {
    display: inline-block; margin-bottom: 8px;
    filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.6));
    cursor: pointer; user-select: none;
}
.logo-text {
    font-family: 'Orbitron', sans-serif; font-size: 32px;
    font-weight: 900;
    background: linear-gradient(135deg, #60a5fa, #3b82f6, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 4px;
}
.vortex-subtitle {
    font-size: 14px; color: #a3b1c6;
    margin-bottom: 20px; letter-spacing: 1px;
}
.timer-row { display: flex; justify-content: center; gap: 12px; margin: 15px 0; }
.timer-box {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(96, 165, 250, 0.3);
    border-radius: 12px; padding: 10px 14px;
    flex: 1; min-width: 120px;
}
.timer-label {
    font-size: 10px; color: #a3b1c6;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 4px;
}
.timer-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px; font-weight: 700; color: #60a5fa;
}
.timer-value.warning { color: #ff6b6b; animation: pulse 1s infinite; }
.btn-claim {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px; font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #3b82f6);
    color: #000; border: none; border-radius: 50px;
    padding: 14px 32px; cursor: pointer;
    margin-top: 20px; width: 100%;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex; align-items: center; justify-content: center;
    gap: 8px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
}
.btn-claim:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }
.btn-claim:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-claim.loading { opacity: 0.8; pointer-events: none; }
.btn-admin {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    margin-top: 8px;
    box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
}
.key-display {
    display: none; margin-top: 20px;
    padding: 15px; background: rgba(0, 0, 0, 0.6);
    border-radius: 12px; border: 1px solid #3b82f6;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; color: #60a5fa;
    word-break: break-all; letter-spacing: 1px;
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
}
.disclaimer {
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(251, 191, 36, 0.08);
    border: 1px solid rgba(251, 191, 36, 0.35);
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.6;
    color: #fbbf24;
    text-align: left;
    display: none;
}
.disclaimer strong {
    color: #f59e0b; display: block;
    margin-bottom: 6px; font-size: 13px;
}
.disclaimer .timer-inline {
    font-family: 'JetBrains Mono', monospace;
    color: #fff;
    background: rgba(0,0,0,0.4);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
}
.status-msg { font-size: 13px; margin-top: 12px; color: #a3b1c6; }
.error-msg {
    font-size: 13px; margin-top: 12px; color: #ff6b6b;
    min-height: 18px; line-height: 1.4;
}
.retry-btn {
    display: inline-block; margin-top: 10px;
    background: transparent; border: 1px solid #3b82f6;
    color: #60a5fa; padding: 6px 18px;
    border-radius: 50px; cursor: pointer;
    font-size: 12px; font-weight: 600;
    transition: background 0.2s;
}
.retry-btn:hover { background: rgba(59, 130, 246, 0.15); }
.spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(0, 0, 0, 0.3);
    border-top-color: #000; border-radius: 50%;
    animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes cardGlow {
    0%,100% { box-shadow: 0 0 40px rgba(59, 130, 246, 0.3), inset 0 0 20px rgba(59, 130, 246, 0.1); }
    50% { box-shadow: 0 0 60px rgba(59, 130, 246, 0.5), inset 0 0 30px rgba(59, 130, 246, 0.2); }
}
</style>
</head>
<body>
<div class="vortex-card" id="vortexCard">
    <div class="vortex-logo" id="vortexLogo">
        <svg width="70" height="70" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#60a5fa" stop-opacity="1" />
                    <stop offset="100%" stop-color="#22d3ee" stop-opacity="1" />
                </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad1)" stroke-width="6" stroke-dasharray="10,5" />
            <circle cx="50" cy="50" r="25" fill="none" stroke="#3b82f6" stroke-width="4" stroke-dasharray="20,5" />
            <circle cx="50" cy="50" r="10" fill="url(#grad1)" />
        </svg>
    </div>
    <div class="logo-text">VORTEX</div>
    <div class="vortex-subtitle">Secure Key Claim</div>

    <div class="timer-row">
        <div class="timer-box">
            <div class="timer-label">Key Expires In</div>
            <div class="timer-value" id="keyTimer">10:00</div>
        </div>
        <div class="timer-box">
            <div class="timer-label">Page Closes In</div>
            <div class="timer-value" id="pageTimer">1:00</div>
        </div>
    </div>

    <div class="status-msg" id="status">Checking claim status...</div>
    <button class="btn-claim" id="claimBtn" style="display:none;">⚡ Claim Your Key</button>
    <button class="btn-claim" id="getKeyBtn" style="display:none;">🛒 GET KEY NOW</button>
    <button class="btn-claim btn-admin" id="adminClaimBtn" style="display:none;">🔓 Admin Get Key</button>
    <div class="key-display" id="keyDisplay"></div>
    <div class="disclaimer" id="disclaimer">
        <strong>⚠️ Key lasts 2 days</strong>
        Valid for <span class="timer-inline">2 days (48 hours)</span> from activation.<br>
        Activate within <span class="timer-inline">10 minutes</span> of claiming or it expires.<br>
        Not recoverable if lost. Copy now.
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="status-msg" id="adminStatus"></div>
</div>

<script>
(function() {
'use strict';

// ============================================
// CONFIG — set to your deployed worker URL
// ============================================
const WORKER_URL  = 'https://YOUR-WORKER.workers.dev';
const START_URL   = WORKER_URL + '/start';
const FETCH_TIMEOUT = 12000;
const CLAIM_WINDOW_MS = 600000;
const PAGE_WINDOW_MS  = 60000;

// ============================================
// STATE
// ============================================
const dataCode = new URLSearchParams(window.location.search).get('data') || '';
let session = null;
let tier = null;
let issuedAt = 0;
let adminMode = false;
let keyTimerInterval = null;
let pageTimerInterval = null;
let keyTimerRemaining = Math.floor(CLAIM_WINDOW_MS / 1000);
let pageTimerRemaining = Math.floor(PAGE_WINDOW_MS / 1000);
let isClaiming = false;

// ============================================
// ANTI-TAMPER
// ============================================
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if (e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(key)) ||
        (e.ctrlKey && ['u','s','p'].includes(key))) {
        e.preventDefault(); return false;
    }
});
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());

try {
    if (window.top !== window.self) window.top.location = window.self.location;
    if (window.opener) window.opener = null;
} catch (e) {}

// ============================================
// UTILS
// ============================================
function formatTime(seconds) {
    if (seconds < 0) seconds = 0;
    const m = Math.floor(seconds / 60), s = seconds % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
async function fetchWithTimeout(url, options = {}) {
    const ctrl = new AbortController();
    const id = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);
    try {
        const r = await fetch(url, { ...options, signal: ctrl.signal, credentials: 'omit', cache: 'no-store' });
        clearTimeout(id);
        return r;
    } catch (err) { clearTimeout(id); throw err; }
}
async function parseResponse(res) {
    try { return await res.json(); } catch { return { error: `Server ${res.status}` }; }
}
function getErrorMessage(d) { return d.error || d.message || d.reason || 'Unknown error'; }

function showError(message, showRetry = false) {
    const errEl = document.getElementById('errorMsg');
    errEl.textContent = message;
    if (showRetry) {
        const retry = document.createElement('button');
        retry.className = 'retry-btn';
        retry.textContent = 'Retry';
        retry.onclick = () => { errEl.innerHTML = ''; bootstrap(); };
        errEl.appendChild(document.createElement('br'));
        errEl.appendChild(retry);
    }
}
function clearError() { document.getElementById('errorMsg').textContent = ''; }
function setStatus(text) { document.getElementById('status').textContent = text; }

// ============================================
// BOOTSTRAP
// ============================================
async function bootstrap() {
    clearError();
    document.getElementById('claimBtn').style.display = 'none';
    document.getElementById('getKeyBtn').style.display = 'none';
    document.getElementById('adminClaimBtn').style.display = 'none';
    document.getElementById('keyDisplay').style.display = 'none';
    document.getElementById('keyDisplay').textContent = '';
    document.getElementById('disclaimer').style.display = 'none';

    if (adminMode) { setStatus('Admin mode active.'); return; }

    // no data code → user landed directly. send to worker /start to kick the funnel.
    if (!dataCode) {
        setStatus('No key code — starting funnel...');
        document.getElementById('getKeyBtn').style.display = 'flex';
        document.getElementById('getKeyBtn').textContent = '▶ Start';
        document.getElementById('getKeyBtn').onclick = () => { window.location.href = START_URL; };
        return;
    }

    setStatus('Establishing secure session...');
    try {
        const res = await fetchWithTimeout(`${WORKER_URL}/session?data=${encodeURIComponent(dataCode)}`);
        const data = await parseResponse(res);

        if (!res.ok || !data.session) {
            setStatus('This offer link is no longer valid.');
            const g = document.getElementById('getKeyBtn');
            g.style.display = 'flex';
            g.textContent = '▶ Start over';
            g.onclick = () => { window.location.href = START_URL; };
            if (data.error) showError(data.error);
            return;
        }

        session = data.session;
        tier = data.tier || 'full';
        issuedAt = data.issuedAt || Date.now();

        startPageTimer();
        startKeyTimer();
        setStatus('Ready to claim.');
        document.getElementById('claimBtn').style.display = 'flex';
    } catch (err) {
        if (err.name === 'AbortError') showError('Request timed out.', true);
        else showError('Connection failed.', true);
        const g = document.getElementById('getKeyBtn');
        g.style.display = 'flex';
        g.textContent = '▶ Start over';
        g.onclick = () => { window.location.href = START_URL; };
    }
}

// ============================================
// TIMERS
// ============================================
function startKeyTimer() {
    if (keyTimerInterval) clearInterval(keyTimerInterval);
    const el = document.getElementById('keyTimer');
    el.textContent = formatTime(keyTimerRemaining);
    keyTimerInterval = setInterval(() => {
        keyTimerRemaining--;
        el.textContent = formatTime(keyTimerRemaining);
        if (keyTimerRemaining <= 30) el.classList.add('warning');
        if (keyTimerRemaining <= 0) {
            clearInterval(keyTimerInterval); keyTimerInterval = null;
            showError('Claim window expired.');
            setStatus('Offer expired.');
            document.getElementById('claimBtn').style.display = 'none';
            const g = document.getElementById('getKeyBtn');
            g.style.display = 'flex';
            g.textContent = '▶ Start over';
            g.onclick = () => { window.location.href = START_URL; };
        }
    }, 1000);
}
function startPageTimer() {
    if (pageTimerInterval) clearInterval(pageTimerInterval);
    const el = document.getElementById('pageTimer');
    el.textContent = formatTime(pageTimerRemaining);
    pageTimerInterval = setInterval(() => {
        pageTimerRemaining--;
        el.textContent = formatTime(pageTimerRemaining);
        if (pageTimerRemaining <= 5) el.classList.add('warning');
        if (pageTimerRemaining <= 0) {
            clearInterval(pageTimerInterval); pageTimerInterval = null;
            try { window.close(); } catch (e) {}
            setTimeout(() => { window.location.replace('about:blank'); }, 400);
        }
    }, 1000);
}

// ============================================
// CLAIM
// ============================================
async function claim() {
    if (isClaiming) return;
    isClaiming = true;
    const btn = document.getElementById('claimBtn');
    const original = btn.innerHTML;
    btn.disabled = true; btn.classList.add('loading');
    btn.innerHTML = '<span class="spinner"></span> Claiming...';
    clearError();

    try {
        const res = await fetchWithTimeout(`${WORKER_URL}/claim`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Session': session || ''
            },
            body: JSON.stringify({ data: dataCode })
        });
        const data = await parseResponse(res);
        const errMsg = getErrorMessage(data);

        if (data.success && data.key) {
            if (keyTimerInterval)  clearInterval(keyTimerInterval);
            if (pageTimerInterval) clearInterval(pageTimerInterval);

            setStatus(data.alreadyClaimed ? 'Key already claimed.' : 'Key claimed.');
            btn.style.display = 'none';

            const kd = document.getElementById('keyDisplay');
            kd.style.display = 'block';
            kd.textContent = data.key;

            document.getElementById('disclaimer').style.display = 'block';

            if (navigator.clipboard) navigator.clipboard.writeText(data.key).catch(() => {});

            setTimeout(() => {
                try { window.close(); } catch (e) {}
                setTimeout(() => { window.location.replace('about:blank'); }, 400);
            }, 15000);
            return;
        }

        if (/expired|invalid|not found|used/i.test(errMsg)) {
            showError(errMsg || 'Link expired or already used.');
            btn.style.display = 'none';
            const g = document.getElementById('getKeyBtn');
            g.style.display = 'flex';
            g.textContent = '▶ Start over';
            g.onclick = () => { window.location.href = START_URL; };
        } else if (/session/i.test(errMsg)) {
            showError('Session invalid. Reloading…');
            setTimeout(bootstrap, 1500);
        } else {
            showError(errMsg || 'Claim failed.');
            btn.disabled = false; btn.classList.remove('loading');
            btn.innerHTML = original;
        }
    } catch (err) {
        if (err.name === 'AbortError') showError('Request timed out.');
        else showError('Network error.');
        btn.disabled = false; btn.classList.remove('loading');
        btn.innerHTML = original;
    } finally {
        isClaiming = false;
    }
}
document.getElementById('claimBtn').addEventListener('click', claim);

// ============================================
// ADMIN (5 clicks on logo)
// ============================================
let logoClicks = 0, logoTimer = null;
document.getElementById('vortexLogo').addEventListener('click', () => {
    logoClicks++;
    if (logoTimer) clearTimeout(logoTimer);
    logoTimer = setTimeout(() => { logoClicks = 0; }, 1500);
    if (logoClicks >= 5) { logoClicks = 0; adminLogin(); }
});
async function sha256Hex(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function adminLogin() {
    const pw = prompt('Admin token:');
    if (!pw) return;
    adminLogin._hash = await sha256Hex(pw);
    adminMode = true;
    document.getElementById('vortexCard').classList.add('admin-mode');
    document.getElementById('adminStatus').textContent = '🟢 Admin mode active.';
    document.getElementById('adminClaimBtn').style.display = 'flex';
    document.getElementById('claimBtn').style.display = 'none';
    document.getElementById('getKeyBtn').style.display = 'none';
}
async function adminClaim() {
    if (isClaiming) return;
    isClaiming = true;
    const btn = document.getElementById('adminClaimBtn');
    const original = btn.innerHTML;
    btn.disabled = true; btn.classList.add('loading');
    btn.innerHTML = '<span class="spinner"></span> Generating...';
    try {
        const res = await fetchWithTimeout(`${WORKER_URL}/admin`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Session': session || '',
                'X-Admin-Hash': adminLogin._hash || ''
            },
            body: JSON.stringify({ hours: 48, profile: 'Admin' })
        });
        const data = await parseResponse(res);
        if (data.success && data.key) {
            setStatus('Admin key created.');
            const kd = document.getElementById('keyDisplay');
            kd.style.display = 'block';
            kd.textContent = data.key;
            document.getElementById('disclaimer').style.display = 'block';
            if (navigator.clipboard) navigator.clipboard.writeText(data.key).catch(() => {});
        } else showError(data.error || 'Admin error.');
    } catch { showError('Network error.'); }
    finally {
        btn.disabled = false; btn.classList.remove('loading');
        btn.innerHTML = original;
        isClaiming = false;
    }
}
document.getElementById('adminClaimBtn').addEventListener('click', adminClaim);

bootstrap();
})();
</script>
</body>
</html>
