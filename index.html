<!DOCTYPE html>
<html lang="in">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Snap - Claim Key</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; color: #fff; text-align: center; padding: 50px 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .logo { font-size: 48px; margin-bottom: 20px; }
        h1 { font-family: 'Sora', sans-serif; font-size: 32px; margin-bottom: 10px; color: #FFD700; }
        p { font-size: 16px; margin-bottom: 30px; color: #a3a3a3; }
        button { padding: 18px 40px; background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%); color: #000; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); margin-top: 10px; }
        button:hover { transform: scale(1.05); }
        button:disabled { background: #475569; color: #fff; cursor: not-allowed; transform: none; }
        #keyBox { margin-top: 30px; font-size: 24px; font-weight: bold; color: #FFD700; background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: 15px; display: none; word-break: break-all; max-width: 400px; }
        #errorBox { display: none; color: red; font-size: 24px; font-weight: bold; margin-top: 30px; max-width: 600px; }
        #status { color: #a3a3a3; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="logo">🍪</div>
    <h1>Cookie Snap Key Claim</h1>
    <p id="status">Loading secure token...</p>
    <button id="claimBtn" onclick="claimKey()" style="display:none;">Claim Your Key</button>
    <div id="keyBox"></div>
    <div id="errorbox">❌ This claim link has expired.<br>Please go back and complete the task again.</div>

    <script>
        // Disable right-click and Ctrl+U
        document.addEventListener('context menu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                return false;
            }
        });

        // Get LootLabs verification token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const dataCode = urlParams.get('data');

        if (!dataCode) {
            document.getElementById('status').style.display = 'none';
            document.getElementById('claimBtn').style.display = 'none';
            document.getElementById('errorBox').innerHTML = "❌ Invalid Access.<br>Please go back and complete the task again.";
            document.getElementById('errorBox').style.display = 'block';
        } else {
            let claimToken = localStorage.getItem('myClaimToken');

            if (!claimToken) {
                // First load: Generate a secure one-time token
                fetch('https://cookie-snap-keys.j26064135.workers.dev/generate-token')
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            claimToken = data.token;
                            localStorage.setItem('myClaimToken', claimToken);
                            document.getElementById('status').innerText = "Ready to claim!";
                            document.getElementById('claimBtn').style.display = 'block';
                        } else {
                            throw new Error('Token generation failed');
                        }
                    })
                    .catch(() => {
                        document.getElementById('status').innerText = "Error connecting to server.";
                        document.getElementById('errorBox').innerHTML = "❌ Network error. Please try again.";
                        document.getElementById('errorBox').style.display = 'block';
                    });
            } else {
                // Refresh/Revisit: Let them try but the Worker will reject if used
                document.getElementById('status').innerText = "Ready to claim!";
                document.getElementById('claimBtn').style.display = 'block';
            }
        }

        async function claimKey() {
            const btn = document.getElementById('claimBtn');
            btn.disabled = true;
            btn.textContent = "Claiming...";

            let claimToken = localStorage.getItem('myClaimToken');
            if (!claimToken) {
                document.getElementById('errorBox').style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`https://cookie-snap-keys.j26064135.workers.dev/claim?token=${claimToken}&data=${dataCode}`);
                const data = await response.json();

                if (data.success) {
                    localStorage.removeItem('myClaimToken');

                    document.getElementById('status').innerText = "Key claimed!";
                    document.getElementById('claimBtn').style.display = 'none';
                    document.getElementById('keyBox').style.display = 'block';
                    document.getElementById('keyBox').innerHTML = `<strong>Your Key:</strong><br><br><span style="font-size:28px;">${data.key}</span><br><br><small>✅ Key copied to clipboard!</small>`;

                    try {
                        await navigator.clipboard.writeText(data.key);
                    } catch (e) {
                        const textArea = document.createElement('textarea');
                        textArea.value = data.key;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }

                    // Attempt to close the page
                    setTimeout(() => {
                        window.close();
                        setTimeout(() => { window.location.href = "about:blank"; }, 500);
                    }, 3000);
                } else {
                    localStorage.removeItem('myClaimToken');
                    document.getElementById('status').style.display = 'none';
                    document.getElementById('claimBtn').style.display = 'none';
                    document.getElementById('errorBox').innerHTML = "❌ This claim link has expired.<br>Please go back and complete the task again.";
                    document.getElementById('errorBox').style.display = 'block';
                }
            } catch (e) {
                alert("Network error. Please try again.");
                btn.disabled = false;
                btn.textContent = "Try Again";
            }
        }
    </script>
</body>
</html>
