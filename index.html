<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX - Claim Key</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url('vortex-bg.png') center center / cover no-repeat;
            filter: brightness(0.6) blur(2px);
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 26, 0.7);
            z-index: -1;
        }
        .vortex-card {
            max-width: 420px;
            width: 90%;
            background: rgba(26, 35, 58, 0.95);
            border: 1px solid #3b82f6;
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.4);
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
        }
        .vortex-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            cursor: default;
            user-select: none;
        }
        .vortex-subtitle {
            font-size: 14px;
            color: #a3b1c6;
            margin-bottom: 20px;
        }
        .timer-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
        }
        .timer-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 10px 14px;
            flex: 1;
            min-width: 120px;
        }
        .timer-label {
            font-size: 10px;
            color: #a3b1c6;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .timer-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            color: #60a5fa;
        }
        .timer-value.warning {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }
        .btn-claim {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: #000;
            border: none;
            border-radius: 50px;
            padding: 14px 32px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-claim:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }
        .btn-claim:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-claim.loading {
            opacity: 0.8;
            pointer-events: none;
        }
        .key-display {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            border: 1px solid #3b82f6;
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            color: #60a5fa;
            word-break: break-all;
            letter-spacing: 1px;
        }
        .status-msg {
            font-size: 13px;
            margin-top: 12px;
            color: #a3b1c6;
        }
        .error-msg {
            font-size: 13px;
            margin-top: 12px;
            color: #ff6b6b;
            min-height: 18px;
            line-height: 1.4;
        }
        .retry-btn {
            display: inline-block;
            margin-top: 10px;
            background: transparent;
            border: 1px solid #3b82f6;
            color: #60a5fa;
            padding: 6px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .retry-btn:hover {
            background: rgba(59, 130, 246, 0.15);
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="vortex-card">
        <div class="vortex-logo" id="vortexLogo">VORTEX</div>
        <div class="vortex-subtitle">Secure Key Claim</div>
        <div class="timer-row">
            <div class="timer-box">
                <div class="timer-label">Key Expires In</div>
                <div class="timer-value" id="keyTimer">10:00</div>
            </div>
            <div class="timer-box">
                <div class="timer-label">Page Closes In</div>
                <div class="timer-value" id="pageTimer">1:00</div>
            </div>
        </div>
        <div class="status-msg" id="status">Checking claim status...</div>
        <button class="btn-claim" id="claimBtn" style="display:none;">⚡ Claim Your Key</button>
        <button class="btn-claim" id="getKeyBtn" style="display:none;">🛒 GET KEY NOW</button>
        <div class="key-display" id="keyDisplay"></div>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script>
        // ============================================
        // DISABLE INSPECT (context menu, F12, shortcuts)
        // ============================================
        (function() {
            // Block right-click
            document.addEventListener('contextmenu', e => e.preventDefault());
            
            // Block common DevTools shortcuts
            document.addEventListener('keydown', e => {
                const key = e.key.toLowerCase();
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(key)) ||
                    (e.ctrlKey && key === 'u') ||
                    (e.ctrlKey && key === 's') ||
                    (e.ctrlKey && key === 'p')
                ) {
                    e.preventDefault();
                    return false;
                }
            });

            // Disable text selection on the whole page (optional)
            document.body.addEventListener('selectstart', e => e.preventDefault());
        })();

        // ============================================
        // CONFIGURATION
        // ============================================
        const WORKER_URL = 'https://cookie-snap-keys.j26064135.workers.dev';
        const LOOTLABS_URL = 'https://loot-link.com/s?OcqajUzG';  // update if expired
        const FETCH_TIMEOUT = 12000;
        const ADMIN_SECRET = 'vortex2025'; // change this

        // ============================================
        // STATE
        // ============================================
        let dataCode = new URLSearchParams(window.location.search).get('data');
        let keyTimerRemaining = 600;
        let pageTimerRemaining = 60;
        let keyTimerInterval = null;
        let pageTimerInterval = null;
        let isClaiming = false;

        // ============================================
        // UTILITIES
        // ============================================
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        async function fetchWithTimeout(url, options = {}) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), FETCH_TIMEOUT);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        async function parseResponse(response) {
            try { return await response.json(); } 
            catch (e) { return { error: `Server returned ${response.status}` }; }
        }

        function getErrorMessage(data) {
            return data.error || data.message || data.reason || 'Unknown error';
        }

        // ============================================
        // TIMERS
        // ============================================
        function startTimers() {
            if (keyTimerInterval) clearInterval(keyTimerInterval);
            if (pageTimerInterval) clearInterval(pageTimerInterval);

            keyTimerInterval = setInterval(() => {
                keyTimerRemaining--;
                const timerEl = document.getElementById('keyTimer');
                timerEl.textContent = formatTime(keyTimerRemaining);
                if (keyTimerRemaining <= 30) timerEl.classList.add('warning');
                if (keyTimerRemaining <= 0) {
                    clearInterval(keyTimerInterval);
                    keyTimerInterval = null;
                    document.getElementById('errorMsg').textContent = "Key claim window expired. Please start over.";
                    document.getElementById('claimBtn').style.display = 'none';
                    document.getElementById('status').textContent = "Offer expired.";
                }
            }, 1000);

            pageTimerInterval = setInterval(() => {
                pageTimerRemaining--;
                const timerEl = document.getElementById('pageTimer');
                timerEl.textContent = formatTime(pageTimerRemaining);
                if (pageTimerRemaining <= 5) timerEl.classList.add('warning');
                if (pageTimerRemaining <= 0) {
                    clearInterval(pageTimerInterval);
                    pageTimerInterval = null;
                    window.close();
                    setTimeout(() => { history.replaceState(null, '', 'about:blank'); window.location.href = 'about:blank'; }, 500);
                }
            }, 1000);
        }

        // ============================================
        // ERROR & UI HELPERS
        // ============================================
        function showError(message, showRetry = false) {
            const errEl = document.getElementById('errorMsg');
            errEl.textContent = message;
            if (showRetry) {
                const retryBtn = document.createElement('button');
                retryBtn.className = 'retry-btn';
                retryBtn.textContent = 'Retry';
                retryBtn.onclick = () => {
                    errEl.innerHTML = '';
                    document.getElementById('status').textContent = 'Checking claim status...';
                    checkIfUsed();
                };
                errEl.appendChild(document.createElement('br'));
                errEl.appendChild(retryBtn);
            }
        }

        function clearError() {
            document.getElementById('errorMsg').textContent = '';
        }

        // ============================================
        // ADMIN BYPASS
        // ============================================
        function triggerAdminPopup() {
            const adminInput = prompt('Enter admin code:');
            if (adminInput === ADMIN_SECRET) {
                const manualCode = prompt('Enter data code:');
                if (manualCode) {
                    dataCode = manualCode.trim();
                    document.getElementById('status').textContent = 'Checking claim status...';
                    checkIfUsed();
                } else {
                    showError('No data code entered.');
                }
            } else {
                showError('Invalid admin code.');
            }
        }

        let logoClicks = 0, logoTimer = null;
        document.getElementById('vortexLogo').addEventListener('click', () => {
            logoClicks++;
            if (logoTimer) clearTimeout(logoTimer);
            logoTimer = setTimeout(() => logoClicks = 0, 500);
            if (logoClicks >= 3) { logoClicks = 0; triggerAdminPopup(); }
        });

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === ADMIN_SECRET && !dataCode) {
            setTimeout(() => triggerAdminPopup(), 100);
        }

        // ============================================
        // MAIN CHECK
        // ============================================
        async function checkIfUsed() {
            clearError();

            if (!dataCode) {
                document.getElementById('status').style.display = 'none';
                document.getElementById('getKeyBtn').style.display = 'block';
                document.getElementById('getKeyBtn').textContent = '🛒 GET KEY NOW';
                document.getElementById('getKeyBtn').onclick = () => { window.location.href = LOOTLABS_URL; };
                return;
            }

            document.getElementById('status').textContent = 'Checking claim status...';

            try {
                const res = await fetchWithTimeout(`${WORKER_URL}/check-data?data=${encodeURIComponent(dataCode)}`);
                const data = await parseResponse(res);
                const errMsg = getErrorMessage(data);

                if (!res.ok || data.used) {
                    document.getElementById('status').textContent = 'This offer link is no longer valid.';
                    document.getElementById('claimBtn').style.display = 'none';
                    document.getElementById('getKeyBtn').style.display = 'block';
                    document.getElementById('getKeyBtn').textContent = '🛒 Get a new key';
                    document.getElementById('getKeyBtn').onclick = () => { window.location.href = LOOTLABS_URL; };
                    if (errMsg && errMsg !== 'Unknown error') showError(errMsg);
                    return;
                }

                // Data code is unused → show claim button
                document.getElementById('status').textContent = 'Ready to claim!';
                document.getElementById('claimBtn').style.display = 'block';
                document.getElementById('getKeyBtn').style.display = 'none';

                startTimers();

            } catch (err) {
                console.error('checkIfUsed error:', err);

                if (err.name === 'AbortError') {
                    showError('Request timed out. Please check your connection and try again.', true);
                } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                    showError('Unable to connect to server. The service may be down. Please try again in a moment.', true);
                } else {
                    showError('Server error: ' + err.message, true);
                }

                document.getElementById('claimBtn').style.display = 'none';
                document.getElementById('getKeyBtn').style.display = 'block';
                document.getElementById('getKeyBtn').textContent = '🛒 Try new key';
                document.getElementById('getKeyBtn').onclick = () => { window.location.href = LOOTLABS_URL; };
            }
        }

        // ============================================
        // CLAIM KEY (NO TOKEN NEEDED)
        // ============================================
        async function claimKey() {
            if (isClaiming) return;
            isClaiming = true;

            const btn = document.getElementById('claimBtn');
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.classList.add('loading');
            btn.innerHTML = '<span class="spinner"></span> Claiming...';

            clearError();

            try {
                const response = await fetchWithTimeout(
                    `${WORKER_URL}/claim?data=${encodeURIComponent(dataCode)}`
                );
                const data = await parseResponse(response);
                const errMsg = getErrorMessage(data);

                if (data.success) {
                    if (keyTimerInterval) clearInterval(keyTimerInterval);
                    if (pageTimerInterval) clearInterval(pageTimerInterval);

                    document.getElementById('status').textContent = data.alreadyClaimed ? 'Key already claimed!' : 'Key claimed!';
                    document.getElementById('claimBtn').style.display = 'none';

                    const keyDisplay = document.getElementById('keyDisplay');
                    keyDisplay.style.display = 'block';
                    keyDisplay.textContent = data.key;

                    navigator.clipboard.writeText(data.key).catch(() => {});

                    setTimeout(() => {
                        window.close();
                        setTimeout(() => { window.location.href = 'about:blank'; }, 500);
                    }, 5000);

                } else {
                    // If error says invalid/expired → show GET KEY button
                    if (/expired|invalid|not found/i.test(errMsg)) {
                        showError(errMsg || 'This offer link is expired.');
                        document.getElementById('claimBtn').style.display = 'none';
                        document.getElementById('getKeyBtn').style.display = 'block';
                        document.getElementById('getKeyBtn').textContent = '🛒 Get a new key';
                        document.getElementById('getKeyBtn').onclick = () => { window.location.href = LOOTLABS_URL; };
                    } else {
                        showError(errMsg || 'Claim failed. Please try again.');
                    }
                    btn.disabled = false;
                    btn.classList.remove('loading');
                    btn.innerHTML = originalBtnText;
                    isClaiming = false;
                }
            } catch (err) {
                console.error('claimKey error:', err);

                if (err.name === 'AbortError') {
                    showError('Request timed out. Please try again.');
                } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                    showError('Network error. Please check your connection and try again.');
                } else {
                    showError('Server error: ' + err.message);
                }

                document.getElementById('claimBtn').style.display = 'none';
                document.getElementById('getKeyBtn').style.display = 'block';
                document.getElementById('getKeyBtn').textContent = '🛒 Try new key';
                document.getElementById('getKeyBtn').onclick = () => { window.location.href = LOOTLABS_URL; };

                btn.disabled = false;
                btn.classList.remove('loading');
                btn.innerHTML = originalBtnText;
                isClaiming = false;
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.getElementById('claimBtn').addEventListener('click', claimKey);
        checkIfUsed();
    </script>
</body>
</html>
